



spring.application.name=taskflow-api

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-shy-cloud-ay8zmlze-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret
jwt.secret=${JWT_SECRET:}

# Server Port (Render)
server.port=${PORT:8080}
